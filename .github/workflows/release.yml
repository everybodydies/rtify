name: Release

# Publishes a GitHub release with a ready-to-install pacman package, a pacman repository
# (rtify.db / rtify.files) and SHA256SUMS. It runs:
#   - on main, when Cargo.toml has a version that has no tag yet: bump `version` in Cargo.toml,
#     give it a dated `## [x.y.z] - YYYY-MM-DD` section in CHANGELOG.md, merge, done;
#   - on a pushed tag: git tag v0.1.0 && git push origin v0.1.0 (must match Cargo.toml);
#   - by hand (Actions → Release → Run workflow) to rebuild an existing tag's assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Decide
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ $EVENT == workflow_dispatch ]]; then TAG=$INPUT_TAG; REF=$INPUT_TAG
          elif [[ $REF_TYPE == tag ]]; then TAG=$GITHUB_REF_NAME; REF=$GITHUB_REF_NAME
          else TAG=v$VERSION; REF=$GITHUB_SHA; fi

          release=true
          if [[ $EVENT == push && $REF_TYPE == branch ]] \
              && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already tagged, nothing to release"; release=false
          elif [[ $EVENT == push && $REF_TYPE == tag ]] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to do (run the workflow by hand to rebuild it)"; release=false
          fi

          if [[ $release == true ]]; then
            [[ $TAG == "v$VERSION" ]] || { echo "::error::Cargo.toml version $VERSION does not match $TAG"; exit 1; }
            grep -q "^## \[$VERSION\] - [0-9]" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no dated section for $VERSION (## [$VERSION] - YYYY-MM-DD)"; exit 1; }
            echo "releasing $TAG from $REF"
          fi
          { echo "release=$release"; echo "tag=$TAG"; echo "version=$VERSION"; echo "ref=$REF"; } >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Tools
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git github-cli >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Build, install and smoke-test the package
        run: OUT="$GITHUB_WORKSPACE/dist" bash packaging/arch/build.sh

      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ---
          **Install (CachyOS / Arch):** download `rtify-*-x86_64.pkg.tar.zst`, then
          `sudo pacman -U rtify-*-x86_64.pkg.tar.zst`. Run `rtify`, or find it in your launcher.

          **Or add the repository** so `pacman -Syu` picks up new releases — append to `/etc/pacman.conf`:
          ```ini
          [rtify]
          SigLevel = Optional TrustAll
          Server = https://github.com/everybodydies/rtify/releases/latest/download
          ```
          then `sudo pacman -Sy rtify`. Check downloads with `sha256sum -c SHA256SUMS --ignore-missing`.

          Spotify setup: see the README (own client ID, redirect `http://127.0.0.1:8898/callback`).
          MD
          sed "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD > dist/PKGBUILD

      - name: pacman repository and checksums
        run: bash packaging/arch/repo.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ needs.plan.outputs.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd dist
          assets=(rtify-*.pkg.tar.zst rtify.db rtify.files SHA256SUMS PKGBUILD)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # A tag pushed via a release made with GITHUB_TOKEN does not start this workflow again.
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
              --title "rtify $VERSION" --notes-file ../notes.md
          fi
