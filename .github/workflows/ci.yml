name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev xvfb imagemagick fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke test against the mock Spotify API
        run: dev/run-demo.sh --headless screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and smoke-test the pacman package
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          OUT="$GITHUB_WORKSPACE/dist" bash packaging/arch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rtify-arch-package
          path: dist/
