name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev libpulse-dev xvfb imagemagick fonts-noto-cjk
          xdotool x11-utils playerctl at-spi2-core python3-gi gir1.2-atspi-2.0 desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke test against the mock Spotify API
        run: dev/run-demo.sh --headless screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
      - name: Packaging checks (desktop entry, AppStream, CLI help, versions)
        run: dev/check-packaging.sh
      - name: UI checks (geometry, screen reader names, screenshots, scroll, MPRIS, click-through)
        run: dev/ui-test.sh ui-test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test
          path: ui-test/

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build, install and smoke-test the pacman package
        run: |
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          OUT="$GITHUB_WORKSPACE/dist" bash packaging/arch/build.sh
      - name: Install from the pacman repository a release would publish
        run: |
          bash packaging/arch/repo.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
          pacman -R --noconfirm rtify
          printf '\n[rtify]\nSigLevel = Optional TrustAll\nServer = file://%s/dist\n' "$GITHUB_WORKSPACE" >> /etc/pacman.conf
          pacman -Sy --noconfirm rtify
          pacman -Qi rtify
          rtify --version
      - uses: actions/upload-artifact@v4
        with:
          name: rtify-arch-package
          path: dist/
