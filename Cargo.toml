[package]
name = "rtify"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
description = "Spotify client for Linux desktops: built-in Connect player, System24 look, tray, global shortcuts, animated lyrics"
license = "GPL-3.0-or-later"
repository = "https://github.com/everybodydies/rtify"
readme = "README.md"

[features]
default = ["japanese-kanji", "builtin-player"]
# Kanji readings via Lindera's embedded IPADIC dictionary (adds the dictionary to the binary;
# build with --no-default-features for a small binary that romanizes kana only).
japanese-kanji = ["dep:lindera"]
# Three bundled demo songs in the lyrics `⋯` menu, for trying the renderer without Spotify.
# Development only: release builds and the pacman package leave it off.
demo = []
# rtify as a Spotify Connect device of its own (librespot, PulseAudio/PipeWire output). Without it
# rtify only remote-controls other devices.
builtin-player = ["dep:librespot-core", "dep:librespot-connect", "dep:librespot-playback", "dep:librespot-protocol", "dep:rustls"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
async-channel = "2"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
ksni = "0.3"
ashpd = { version = "0.13", features = ["global_shortcuts"] }
oo7 = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
pinyin = "0.11"
quick-xml = "0.42"
lindera = { version = "6", optional = true, features = ["embed-ipadic"] }
librespot-core = { version = "0.8", optional = true, default-features = false, features = ["rustls-tls-native-roots"] }
librespot-connect = { version = "0.8", optional = true, default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", optional = true, default-features = false, features = ["pulseaudio-backend", "rustls-tls-native-roots"] }
librespot-protocol = { version = "0.8", optional = true }
# Already in the tree twice over (reqwest, librespot); rtify only picks the process-wide provider.
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
